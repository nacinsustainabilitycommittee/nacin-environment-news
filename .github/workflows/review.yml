name: Editorial review (manual)
on:
  workflow_dispatch:
    inputs:
      story_id:
        description: '16-character story ID shown on the review queue'
        required: true
        type: string
      decision:
        description: 'Publish or reject this candidate'
        required: true
        type: choice
        options:
          - approve
          - reject
      note:
        description: 'Editorial note (optional, public if approved)'
        required: false
        type: string
      species:
        description: 'Verified species/product (comma separated), leave empty to retain existing value'
        required: false
        type: string
      incident_country:
        description: 'Incident country (not publication country), leave empty to retain existing value'
        required: false
        type: string
      publication_date:
        description: 'Article publication date YYYY-MM-DD; fill only to correct missing/wrong date (especially RSS)'
        required: false
        type: string
      verification:
        description: 'Verified only if species and incident country checked against source; Unknown otherwise'
        required: true
        default: unknown
        type: choice
        options:
          - unknown
          - verified
          - unverified
permissions:
  contents: write
concurrency:
  group: nacin-content-write
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    environment: editorial # Create this protected environment in repository settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply decision
        env:
          STORY_ID: ${{ inputs.story_id }}
          DECISION: ${{ inputs.decision }}
          NOTE: ${{ inputs.note }}
          EDITOR: ${{ github.actor }}
          SPECIES: ${{ inputs.species }}
          COUNTRY: ${{ inputs.incident_country }}
          VERIFICATION: ${{ inputs.verification }}
          PUBLICATION_DATE: ${{ inputs.publication_date }}
        run: python scripts/review.py "$STORY_ID" "$DECISION" --editor "$EDITOR" --note "$NOTE" --species "$SPECIES" --country "$COUNTRY" --verification "$VERIFICATION" --publication-date "$PUBLICATION_DATE"
      - name: Commit decision
        run: |
          git config user.name 'nacin-editorial-bot'
          git config user.email 'nacin-editorial-bot@users.noreply.github.com'
          git add site/data/
          git diff --cached --quiet || (git commit -m 'content: record editorial review' && git push)
