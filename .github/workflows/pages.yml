name: Deploy public website
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/styles.css'
      - 'site/app.js'
      - 'site/data/published.json'
      - '.github/workflows/pages.yml'
      - 'site/editor.html'
      - 'scripts/build_public.py'
      - 'site/analytics.html'
      - 'site/analytics.js'
      - 'site/analytics-core.js'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: python scripts/build_public.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v4
