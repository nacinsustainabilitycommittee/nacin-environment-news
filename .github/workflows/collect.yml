name: Collect wildlife news (daily)
on:
  schedule:
    - cron: '17 3 * * *' # 08:47 IST, every day; GitHub scheduling may be delayed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nacin-content-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch metadata into editorial queue
        run: python scripts/collector.py
      - name: Commit updated editorial queue
        run: |
          git config user.name 'nacin-news-bot'
          git config user.email 'nacin-news-bot@users.noreply.github.com'
          git add site/data/pending.json site/data/last_run.json
          git diff --cached --quiet || (git commit -m 'chore: collect wildlife news candidates' && git push)
