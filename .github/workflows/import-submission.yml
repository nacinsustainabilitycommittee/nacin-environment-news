name: Import submitted news link (editor triage)
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number from Submit News Link form'
        required: true
        type: number
permissions:
  contents: write
  issues: read
concurrency:
  group: nacin-content-write
  cancel-in-progress: false
jobs:
  import:
    environment: editorial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch submission (data only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: gh issue view "$ISSUE_NUMBER" --json number,body,labels,author > "$RUNNER_TEMP/news-issue.json"
      - name: Import to pending queue
        run: python scripts/import_submission.py "$RUNNER_TEMP/news-issue.json"
      - name: Commit queue (nothing published yet)
        run: |
          git config user.name 'nacin-news-bot'
          git config user.email 'nacin-news-bot@users.noreply.github.com'
          git add site/data/pending.json
          git diff --cached --quiet || (git commit -m 'content: queue manually submitted news link' && git push)
