name: Submit wildlife news
description: Suggest a public wildlife trafficking or conservation enforcement report for editorial review.
title: "[News submission] "
labels: ["news-submission"]
body:
  - type: markdown
    attributes:
      value: "Submit public news links only. Do not disclose confidential or personal enforcement information. Submissions are reviewed and are not automatically published. A GitHub account is required."
  - type: input
    id: headline
    attributes:
      label: Article headline
      description: Enter the original headline as published.
      placeholder: Original article title
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Original article URL
      description: Link directly to the original published article.
      placeholder: https://example.org/article
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Wildlife trafficking
        - Wildlife conservation
        - Seizures & enforcement
        - CITES & wildlife law
        - Research & reports
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Relevance to Customs officers (optional)
      description: Brief public-context explanation only. No confidential information.
    validations:
      required: false
  - type: input
    id: publication_date
    attributes:
      label: Article publication date
      description: Required for archiving. Use YYYY-MM-DD as printed on original article.
      placeholder: '2026-11-04'
    validations:
      required: true
  - type: input
    id: species
    attributes:
      label: Species or wildlife product (optional)
      description: Separate multiple species with commas. Use names mentioned in the report only.
      placeholder: Indian star tortoise, pangolin
    validations:
      required: false
  - type: input
    id: incident_country
    attributes:
      label: Incident country
      description: Country where the incident occurred; do NOT enter the publishers country unless it is also the incident location.
      placeholder: India
    validations:
      required: false
  - type: dropdown
    id: incident_type
    attributes:
      label: Incident type (optional)
      options:
        - Unknown
        - Seizure
        - Smuggling
        - Trafficking
        - Poaching
        - Arrest / Investigation
        - Other
    validations:
      required: false
