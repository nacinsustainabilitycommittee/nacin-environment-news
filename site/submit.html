
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Submit News | NACIN Environment News</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .submit-box {
      max-width: 620px;
      margin: 50px auto;
      padding: 28px;
      background: #fff;
      color: #182a24;
      border-radius: 12px;
    }
    .submit-box label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }
    .submit-box input,
    .submit-box textarea,
    .submit-box select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font: inherit;
    }
    .submit-box .help { color: #52655c; font-size: 0.88rem; margin: 5px 0 0; }
    .submit-box button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #164b37;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<main class="submit-box">
  <h1>Submit Wildlife News</h1>
  <p>
    Suggest a wildlife trafficking or
    conservation enforcement news article
    for editorial review.
  </p>

  <form id="newsForm">
    <label for="title">News headline</label>
    <input id="title" maxlength="240" required
           minlength="5">

    <label for="url">Original article URL</label>
    <input id="url" type="url" maxlength="2000"
           required>

    <label for="publication_date">Article publication date *</label>
    <input id="publication_date" name="publication_date" type="date" required>
    <p class="help">Date the news article was published (not the seizure date). Used for the archive.</p>

    <label for="category">Category *</label>
    <select id="category" name="category" required>
      <option value="">Select a category</option>
      <option value="Wildlife trafficking">Wildlife trafficking</option>
      <option value="Seizures & enforcement">Seizures & enforcement</option>
      <option value="Wildlife conservation">Wildlife conservation</option>
      <option value="CITES & wildlife law">CITES & wildlife law</option>
      <option value="Research & reports">Research & reports</option>
    </select>

    <label for="species">Species / wildlife product (optional)</label>
    <input id="species" name="species" maxlength="300"
           placeholder="e.g. Pangolin, Indian star tortoise, shahtoosh">

    <label for="incident_country">Incident country (optional)</label>
    <input id="incident_country" name="incident_country" maxlength="120"
           placeholder="Country where the incident occurred">
    <p class="help">Leave blank if unclear; do not enter the news publisher's country instead.</p>

    
<label for="incident_state">
  Incident State / Union Territory (India only)
</label>

<select id="incident_state" name="incident_state">
  <option value="">Select State / UT (Optional)</option>
  <option>Andhra Pradesh</option>
  <option>Arunachal Pradesh</option>
  <option>Assam</option>
  <option>Bihar</option>
  <option>Chhattisgarh</option>
  <option>Goa</option>
  <option>Gujarat</option>
  <option>Haryana</option>
  <option>Himachal Pradesh</option>
  <option>Jharkhand</option>
  <option>Karnataka</option>
  <option>Kerala</option>
  <option>Madhya Pradesh</option>
  <option>Maharashtra</option>
  <option>Manipur</option>
  <option>Meghalaya</option>
  <option>Mizoram</option>
  <option>Nagaland</option>
  <option>Odisha</option>
  <option>Punjab</option>
  <option>Rajasthan</option>
  <option>Sikkim</option>
  <option>Tamil Nadu</option>
  <option>Telangana</option>
  <option>Tripura</option>
  <option>Uttar Pradesh</option>
  <option>Uttarakhand</option>
  <option>West Bengal</option>
  <option>Andaman and Nicobar Islands</option>
  <option>Chandigarh</option>
  <option>Dadra and Nagar Haveli and Daman and Diu</option>
  <option>Delhi</option>
  <option>Jammu and Kashmir</option>
  <option>Ladakh</option>
  <option>Lakshadweep</option>
  <option>Puducherry</option>
</select>


    <label for="description">
      Description (optional)
    </label>
    <textarea id="description"
              maxlength="1000" rows="4"></textarea>

    <button id="submitButton" type="submit">
      Submit for Review
    </button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <p><a href="index.html">Back to News Portal</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://wcbdrdisziydpdymfzfn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_K2sQg7bY9JE4Ve6HRpQJxA_zZz6p3rL";

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  
const countryInput = document.getElementById("incident_country");
const stateSelect = document.getElementById("incident_state");

function updateStateVisibility() {
  const isIndia =
    countryInput.value.trim().toLowerCase() === "india";

  stateSelect.disabled = !isIndia;

  stateSelect.closest(".state-field").hidden = !isIndia;

  if (!isIndia) {
    stateSelect.value = "";
  }
}

countryInput.addEventListener("input", updateStateVisibility);
updateStateVisibility();


  document.getElementById("newsForm")
    .addEventListener("submit", async function(event) {
      event.preventDefault();

      const button = document.getElementById(
        "submitButton"
      );
      const message = document.getElementById(
        "message"
      );

      button.disabled = true;
      message.textContent = "Submitting...";

      const submission = {
        title: document.getElementById("title")
          .value.trim(),
        url: document.getElementById("url")
          .value.trim(),
        publication_date: document.getElementById("publication_date").value,
        category: document.getElementById("category").value,
        species: document.getElementById("species").value.trim() || null,
        incident_country: document.getElementById("incident_country").value.trim() || null,
        description: document.getElementById(
          "description"
        ).value.trim()
      };

      try {
        const parsed = new URL(submission.url);
        if (!["https:", "http:"].includes(
          parsed.protocol
        )) {
          throw new Error("Please enter a valid news URL.");
        }

        if (!submission.publication_date || !submission.category) {
          throw new Error("Please provide the publication date and category.");
        }
        // Date-only values use ISO YYYY-MM-DD; reject future publication dates.
        const today = new Date();
        const localToday = [today.getFullYear(),
          String(today.getMonth() + 1).padStart(2, "0"),
          String(today.getDate()).padStart(2, "0")].join("-");
        if (submission.publication_date > localToday) {
          throw new Error("Publication date cannot be in the future.");
        }

        const { error } = await db
          .from("news_submissions")
          .insert(submission);

        if (error) throw error;

        message.textContent =
          "Submitted successfully! " +
          "Your link will be reviewed before publication.";

        document.getElementById("newsForm").reset();
      } catch (error) {
        message.textContent =
          "Submission failed: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
</script>

</body>
</html>
